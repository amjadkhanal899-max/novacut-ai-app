name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # تمام کمانڈز اس فولڈر کے اندر چلیں گی
    defaults:
      run:
        working-directory: ./YOUR_FOLDER_NAME

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: novacut-release-apk
          path: YOUR_FOLDER_NAME/build/app/outputs/flutter-apk/app-release.apk
          
