name: Build NovaCut AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Auto-Detect Project Root & Build APK
        run: |
          # Check where pubspec.yaml is located
          if [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          elif [ -f "app/pubspec.yaml" ]; then
            TARGET_DIR="app"
          else
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi

          echo "Building Flutter project in directory: $TARGET_DIR"
          cd $TARGET_DIR
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacut-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
