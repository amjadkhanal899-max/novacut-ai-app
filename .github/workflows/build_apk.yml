name: Build NovaCut AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Deep Find pubspec.yaml & Build APK
        run: |
          # Find the exact directory where pubspec.yaml lives
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml is completely missing from the repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacut-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
